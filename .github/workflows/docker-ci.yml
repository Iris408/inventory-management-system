name: Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create backend CI environment
        run: |
          cat > backend/.env <<'EOF'
          DATABASE_URL=postgresql://inventory_user:inventory_password@db:5432/partspilot_db
          SECRET_KEY=docker-ci-test-secret
          CORS_ORIGINS=http://localhost:5173
          EOF

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build Docker Compose services
        run: docker compose build