name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # EN: Check out the repository code
      # JP: リポジトリのコードを取得します
      - name: Checkout repository
        uses: actions/checkout@v4

      # EN: Set up Node.js for the React/Vite frontend
      # JP: React/Viteフロントエンド用にNode.jsを設定します
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # EN: Install frontend dependencies
      # JP: フロントエンドの依存関係をインストールします
      - name: Install dependencies
        run: npm ci

      # EN: Build the production frontend
      # JP: 本番用フロントエンドをビルドします
      - name: Build frontend
        run: npm run build