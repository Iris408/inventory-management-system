name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      TESTING: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/partspilot_db
      SECRET_KEY: github-actions-test-secret
      CORS_ORIGINS: http://localhost:5173

    steps:
      # EN: Check out the repository code
      # JP: リポジトリのコードを取得します
      - name: Checkout repository
        uses: actions/checkout@v4

      # EN: Set up Python for the FastAPI backend
      # JP: FastAPIバックエンド用にPythonを設定します
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # EN: Install backend dependencies
      # JP: バックエンドの依存関係をインストールします
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # EN: Check Python syntax
      # JP: Pythonコードの構文を確認します
      - name: Check Python syntax
        run: python -m compileall app main.py

      # EN: Confirm the FastAPI app imports successfully
      # JP: FastAPIアプリが正常にインポートできることを確認します
      - name: Check FastAPI app import
        run: python -c "from main import app; print('FastAPI app imported successfully')"

      # EN: Run the backend test suite
      # JP: バックエンドのテストスイートを実行します
      - name: Run backend tests
        run: python -m pytest -v