name: partspilot

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: inventory_user
          POSTGRES_PASSWORD: inventory_password
          POSTGRES_DB: partspilot_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v3

      - name: Build API
        run: docker build -t partspilot-api ./backend

      - name: Build Frontend
        run: docker build -t partspilot-frontend ./frontend

      - name: Test API Health
        run: |
          docker run -d --name test-api -p 8000:8000 -e DATABASE_URL=postgresql://inventory_user:inventory_password@localhost:5432/partspilot_db partspilot-api
          sleep 5
          curl http://localhost:8000/health || exit 1